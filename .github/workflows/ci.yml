name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 只放 Windows：ubuntu-latest 已经是 Ubuntu 26.04，GitHub 不再提供 3.9 的预编译包。
        # 其余版本在 Ubuntu 上跑，两端合起来覆盖 3.9–3.13。
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m py_compile scripts/phone.py

      - name: 离线测试（不需要手机，不需要 adb）
        run: python -m unittest discover -s tests -v

      - name: CLI 冒烟（没有 adb 也应当可用）
        run: |
          python scripts/phone.py --help
          python scripts/phone.py parse tests/fixtures/ui_sample.xml
          python scripts/phone.py parse tests/fixtures/ui_empty.xml
